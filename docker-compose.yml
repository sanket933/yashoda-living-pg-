version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: yahoda-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/yahoda_living
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN_ADMIN=8h
      - JWT_EXPIRES_IN_STUDENT=7d
      - PORT=5000
      - CLIENT_URL=${CLIENT_URL}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_SECURE=${EMAIL_SECURE}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE}
      - ALLOWED_FILE_TYPES=${ALLOWED_FILE_TYPES}
      - ENABLE_CRON_JOBS=${ENABLE_CRON_JOBS}
      - CRON_REMINDER_TIME=${CRON_REMINDER_TIME}
      - CRON_OVERDUE_CHECK_TIME=${CRON_OVERDUE_CHECK_TIME}
      - CRON_WEEKLY_SUMMARY_TIME=${CRON_WEEKLY_SUMMARY_TIME}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FILE=${LOG_FILE}
      - SESSION_SECRET=${SESSION_SECRET}
      - SESSION_MAX_AGE=${SESSION_MAX_AGE}
    env_file:
      - .env.production
    depends_on:
      - mongodb
    networks:
      - yahoda-network
    volumes:
      - backend-logs:/app/logs

  # Frontend Service (if building with Docker)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: yahoda-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_CLIENT_URL=${VITE_CLIENT_URL}
    depends_on:
      - backend
    networks:
      - yahoda-network

  # MongoDB Service
  mongodb:
    image: mongo:6.0
    container_name: yahoda-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    networks:
      - yahoda-network
    command: mongod --auth

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: yahoda-nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - yahoda-network

networks:
  yahoda-network:
    driver: bridge

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  backend-logs:
    driver: local
